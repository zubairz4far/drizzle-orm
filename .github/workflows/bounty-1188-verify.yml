name: bounty-1188-verify

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter drizzle-orm test -- mysql-binary-buffer.test.ts
      - run: pnpm --filter drizzle-orm test:types

# Temporary fork-only verification workflow.
